<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala Diária de Operação - Reclame Aqui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f17;
      --panel-bg: #151c28;
      --panel-border: #232d3f;
      --accent-gold: #d4af37;
      --accent-gold-hover: #b89628;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --card-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Cabeçalho */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--panel-border);
    }

    .app-title h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .app-title p {
      font-size: 0.825rem;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary { background-color: var(--accent-gold); color: #000; }
    .btn-primary:hover { background-color: var(--accent-gold-hover); }
    
    .btn-clear { background-color: #334155; color: #f8fafc; }
    .btn-clear:hover { background-color: #475569; }

    .btn-lock { background-color: #ef4444; color: #fff; }
    .btn-unlock { background-color: #eab308; color: #000; }

    /* Painel de Controle e Relatório */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .panel-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
    }

    .panel-header {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    textarea.report-input {
      width: 100%;
      height: 65px;
      background: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 10px;
      font-family: inherit;
      font-size: 0.875rem;
      resize: none;
      outline: none;
    }

    textarea.report-input:focus { border-color: var(--accent-gold); }

    .admin-box {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .admin-controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .admin-controls input {
      flex: 1;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
    }

    /* Grade Principal das Casas */
    .houses-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .house-box {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      min-height: 200px;
    }

    .house-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .badge-pixbet { background: #1e3a8a; color: #93c5fd; border: 1px solid #2563eb; }
    .badge-betdasorte { background: #065f46; color: #6ee7b7; border: 1px solid #059669; }
    .badge-ganheibet { background: #713f12; color: #fde047; border: 1px solid #ca8a04; }

    .slots-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slot-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 0.925rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .slot-card.editable {
      cursor: pointer;
      border-color: var(--accent-gold);
    }

    .slot-card.editable:hover { background: #1e293b; }

    .slot-card .tag-icon {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Painel da Equipe */
    .team-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .team-input-box label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .team-input-box input {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }

    .team-input-box input:focus { border-color: var(--accent-gold); }
  </style>
</head>
<body>

  <!-- Cabeçalho Principal -->
  <div class="app-header">
    <div class="app-title">
      <h1>Escala Reclame Aqui — Turno Único (09:00 às 17:00)</h1>
      <p id="subDate">Gestão Diária de Operação e Rodízio Balanceado</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-clear" id="btnLimpar">
        🧹 Limpar Escala
      </button>
      <button class="btn btn-primary" id="btnSorteio">
        🔄 Executar Rodízio Diário
      </button>
    </div>
  </div>

  <!-- Painel de Relatório e Trava Admin -->
  <div class="dashboard-grid">
    <div class="panel-card">
      <div class="panel-header" id="lblReportDate">Relatório do Dia</div>
      <textarea id="txtReport" class="report-input" placeholder="Anotações e resumo do relatório operacional do dia..."></textarea>
    </div>

    <div class="panel-card admin-box">
      <div>
        <div class="panel-header">Controle Supervisor</div>
        <div id="lockStatus" style="font-size: 0.825rem; color: var(--text-secondary);">
          🔒 Status: <strong>Bloqueado (Leitura)</strong>
        </div>
      </div>
      <div class="admin-controls">
        <input type="password" id="adminPassword" placeholder="Senha Admin">
        <button class="btn btn-unlock" id="btnUnlock">Desbloquear</button>
        <button class="btn btn-lock" id="btnLock" style="display:none;">Bloquear</button>
      </div>
    </div>
  </div>

  <!-- Casas da Operação -->
  <div class="houses-container">
    <!-- PIXBET -->
    <div class="house-box">
      <span class="house-badge badge-pixbet" id="badge-pixbet">Pixbet</span>
      <div class="slots-list" id="container-pixbet"></div>
    </div>

    <!-- BETDASORTE -->
    <div class="house-box">
      <span class="house-badge badge-betdasorte" id="badge-betdasorte">BetdaSorte</span>
      <div class="slots-list" id="container-betdasorte"></div>
    </div>

    <!-- GANHEIBET -->
    <div class="house-box">
      <span class="house-badge badge-ganheibet" id="badge-ganheibet">Ganheibet</span>
      <div class="slots-list" id="container-ganheibet"></div>
    </div>
  </div>

  <!-- Painel de Equipe (5 Colaboradores) -->
  <div class="team-panel">
    <div class="panel-header">Equipe do Dia (5 Colaboradores)</div>
    <div class="team-grid">
      <div class="team-input-box">
        <label>Colaborador 1</label>
        <input type="text" id="note1" class="note-input" placeholder="Nome 1">
      </div>
      <div class="team-input-box">
        <label>Colaborador 2</label>
        <input type="text" id="note2" class="note-input" placeholder="Nome 2">
      </div>
      <div class="team-input-box">
        <label>Colaborador 3</label>
        <input type="text" id="note3" class="note-input" placeholder="Nome 3">
      </div>
      <div class="team-input-box">
        <label>Colaborador 4</label>
        <input type="text" id="note4" class="note-input" placeholder="Nome 4">
      </div>
      <div class="team-input-box">
        <label>Colaborador 5</label>
        <input type="text" id="note5" class="note-input" placeholder="Nome 5">
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-Siu-U7Z9-arpi1wWL5kV6pdV3COjYQk",
      authDomain: "escala-ra.firebaseapp.com",
      projectId: "escala-ra",
      storageBucket: "escala-ra.firebasestorage.app",
      messagingSenderId: "826269273192",
      appId: "1:826269273192:web:ab4995fcd8697ce5bdffdd",
      measurementId: "G-MH61MGJH7J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const todayStr = new Date().toLocaleDateString('pt-BR');
    document.getElementById('subDate').innerText = `Gestão Diária — ${todayStr}`;
    document.getElementById('lblReportDate').innerText = `Relatório Operacional (${todayStr})`;

    let escalaGlobal = {};
    let isEditable = false;

    const escalaRef = ref(db, 'escala_ra/atual');
    const reportRef = ref(db, 'escala_ra/relatorio');
    const notesRef = ref(db, 'escala_ra/notas');

    const distribuicoesPossiveis = [
      { pixbet: 2, betdasorte: 1, ganheibet: 2 },
      { pixbet: 2, betdasorte: 2, ganheibet: 1 },
      { pixbet: 1, betdasorte: 2, ganheibet: 2 }
    ];

    onValue(escalaRef, (snapshot) => {
      escalaGlobal = snapshot.val() || {};
      renderizarEscala();
    });

    function renderizarEscala() {
      const cPixbet = document.getElementById('container-pixbet');
      const cBetdaSorte = document.getElementById('container-betdasorte');
      const cGanheibet = document.getElementById('container-ganheibet');

      cPixbet.innerHTML = '';
      cBetdaSorte.innerHTML = '';
      cGanheibet.innerHTML = '';

      const estruturaAtual = escalaGlobal.estrutura || { pixbet: 2, betdasorte: 1, ganheibet: 2 };

      document.getElementById('badge-pixbet').innerText = `Pixbet — ${estruturaAtual.pixbet} ${estruturaAtual.pixbet > 1 ? 'Vagas' : 'Vaga'}`;
      document.getElementById('badge-betdasorte').innerText = `BetdaSorte — ${estruturaAtual.betdasorte} ${estruturaAtual.betdasorte > 1 ? 'Vagas' : 'Vaga'}`;
      document.getElementById('badge-ganheibet').innerText = `Ganheibet — ${estruturaAtual.ganheibet} ${estruturaAtual.ganheibet > 1 ? 'Vagas' : 'Vaga'}`;

      const criarSlotCard = (slotId, label) => {
        const card = document.createElement('div');
        card.className = `slot-card ${isEditable ? 'editable' : ''}`;
        card.onclick = () => trocarAgente(slotId);

        const nome = escalaGlobal[slotId] || '-';
        card.innerHTML = `<span>${nome}</span><span class="tag-icon">${label}</span>`;
        return card;
      };

      for (let i = 1; i <= estruturaAtual.pixbet; i++) {
        cPixbet.appendChild(criarSlotCard(`pixbet_${i}`, `Vaga ${i}`));
      }
      for (let i = 1; i <= estruturaAtual.betdasorte; i++) {
        cBetdaSorte.appendChild(criarSlotCard(`betdasorte_${i}`, `Vaga ${i}`));
      }
      for (let i = 1; i <= estruturaAtual.ganheibet; i++) {
        cGanheibet.appendChild(criarSlotCard(`ganheibet_${i}`, `Vaga ${i}`));
      }
    }

    function obterEquipe() {
      const equipe = [];
      for (let i = 1; i <= 5; i++) {
        const val = document.getElementById(`note${i}`).value.trim();
        if (val !== '') equipe.push(val);
      }
      return equipe;
    }

    function embaralhar(arr) {
      const copia = [...arr];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    // Executar Rodízio (Protegido por Senha Admin)
    document.getElementById('btnSorteio').addEventListener('click', () => {
      if (!isEditable) {
        alert("Apenas o administrador pode executar o rodízio. Insira a senha e clique em 'Desbloquear'!");
        return;
      }

      try {
        const equipe = obterEquipe();

        if (equipe.length !== 5) {
          alert("Preencha exatamente os 5 colaboradores nas caixas abaixo para realizar o rodízio!");
          return;
        }

        const escalaAnterior = escalaGlobal || {};

        // Mapear casa anterior
        const casaAnteriorAgente = {};
        Object.keys(escalaAnterior).forEach(key => {
          if (key.includes('_')) {
            const casaNome = key.split('_')[0];
            const agente = escalaAnterior[key];
            if (agente && agente !== '-') casaAnteriorAgente[agente] = casaNome;
          }
        });

        const padraoAnterior = typeof escalaAnterior.padraoIdx === 'number' ? escalaAnterior.padraoIdx : 0;
        const padraoIdx = (padraoAnterior + 1) % 3;
        const novaEstrutura = distribuicoesPossiveis[padraoIdx];

        let melhorPayload = null;
        let tentativas = 0;

        while (tentativas < 100) {
          tentativas++;
          const candidatos = embaralhar(equipe);
          let conflito = false;
          let pIndex = 0;

          const tempPayload = { estrutura: novaEstrutura, padraoIdx: padraoIdx };

          for (let i = 1; i <= novaEstrutura.pixbet; i++) {
            const agente = candidatos[pIndex++];
            if (casaAnteriorAgente[agente] === 'pixbet') conflito = true;
            tempPayload[`pixbet_${i}`] = agente;
          }
          for (let i = 1; i <= novaEstrutura.betdasorte; i++) {
            const agente = candidatos[pIndex++];
            if (casaAnteriorAgente[agente] === 'betdasorte') conflito = true;
            tempPayload[`betdasorte_${i}`] = agente;
          }
          for (let i = 1; i <= novaEstrutura.ganheibet; i++) {
            const agente = candidatos[pIndex++];
            if (casaAnteriorAgente[agente] === 'ganheibet') conflito = true;
            tempPayload[`ganheibet_${i}`] = agente;
          }

          if (!conflito) {
            melhorPayload = tempPayload;
            break;
          } else if (!melhorPayload) {
            melhorPayload = tempPayload;
          }
        }

        set(escalaRef, melhorPayload);
      } catch (err) {
        console.error("Erro no rodízio:", err);
        alert("Erro ao executar rodízio: " + err.message);
      }
    });

    // Limpar Escala (Protegido por Senha Admin)
    document.getElementById('btnLimpar').addEventListener('click', () => {
      if (!isEditable) {
        alert("Apenas o administrador pode limpar a escala. Insira a senha e clique em 'Desbloquear'!");
        return;
      }

      if (confirm("Deseja realmente limpar a escala exibida?")) {
        set(escalaRef, {
          estrutura: { pixbet: 2, betdasorte: 1, ganheibet: 2 },
          pixbet_1: '-', pixbet_2: '-',
          betdasorte_1: '-',
          ganheibet_1: '-', ganheibet_2: '-'
        });
      }
    });

    // Edição Manual
    window.trocarAgente = function(slotId) {
      if (!isEditable) return;
      const nomeAtual = escalaGlobal[slotId] || '';
      const novoNome = prompt("Alterar colaborador desta vaga:", nomeAtual);
      if (novoNome !== null && novoNome.trim() !== '') {
        set(ref(db, `escala_ra/atual/${slotId}`), novoNome.trim());
      }
    };

    // Sincronização de Relatório e Nomes
    onValue(reportRef, (snapshot) => {
      if (document.activeElement !== document.getElementById('txtReport')) {
        document.getElementById('txtReport').value = snapshot.val() || '';
      }
    });

    onValue(notesRef, (snapshot) => {
      const notes = snapshot.val() || {};
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById(`note${i}`);
        if (document.activeElement !== el) {
          el.value = notes[`note${i}`] || '';
        }
      }
    });

    document.getElementById('txtReport').addEventListener('input', (e) => set(reportRef, e.target.value));

    document.querySelectorAll('.note-input').forEach(el => {
      el.addEventListener('input', () => {
        const payload = {};
        for (let i = 1; i <= 5; i++) {
          payload[`note${i}`] = document.getElementById(`note${i}`).value;
        }
        set(notesRef, payload);
      });
    });

    // Controle Admin
    const btnUnlock = document.getElementById('btnUnlock');
    const btnLock = document.getElementById('btnLock');
    const adminPassword = document.getElementById('adminPassword');
    const lockStatus = document.getElementById('lockStatus');

    btnUnlock.addEventListener('click', () => {
      if (adminPassword.value === '1234') {
        isEditable = true;
        lockStatus.innerHTML = '🔓 Status: <strong style="color:#eab308;">Edição Liberada</strong>';
        btnUnlock.style.display = 'none';
        btnLock.style.display = 'inline-block';
        adminPassword.value = '';
        renderizarEscala();
      } else {
        alert('Senha incorreta!');
      }
    });

    btnLock.addEventListener('click', () => {
      isEditable = false;
      lockStatus.innerHTML = '🔒 Status: <strong>Bloqueado (Leitura)</strong>';
      btnUnlock.style.display = 'inline-block';
      btnLock.style.display = 'none';
      renderizarEscala();
    });
  </script>
</body>
</html>
