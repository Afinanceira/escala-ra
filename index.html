<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala Reclame Aqui - Operação RA</title>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #3b82f6;
      --border-color: #333;
      --text-color: #ffffff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .report-panel {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .report-panel textarea {
      width: 100%;
      height: 70px;
      background: #2a2a2a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      resize: vertical;
      box-sizing: border-box;
    }

    .admin-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 10px 15px;
      border-radius: 8px;
    }

    .admin-controls input[type="password"] {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #2a2a2a;
      color: #fff;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-draw { background-color: #10b981; color: #fff; }
    .btn-unlock { background-color: #eab308; color: #000; }
    .btn-lock { background-color: #ef4444; color: #fff; }

    .columns-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .house-column {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      min-height: 250px;
      border: 2px dashed transparent;
    }

    .house-column.drag-over {
      border-color: var(--accent-color);
      background: #252529;
    }

    .house-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .cards-list {
      min-height: 180px;
    }

    .agent-card {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      user-select: none;
    }

    .agent-card.draggable {
      cursor: grab;
      border-color: var(--accent-color);
    }

    .agent-card.draggable:active {
      cursor: grabbing;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .note-box {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
    }

    .note-box textarea {
      width: 100%;
      height: 60px;
      background: #2a2a2a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      margin-top: 5px;
      resize: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Escala Reclame Aqui (09:00 às 17:00)</h2>
    <button class="btn btn-draw" id="btnSorteio">🎲 Realizar Sorteio Automático</button>
  </div>

  <div class="report-panel">
    <label id="lblReportDate"><strong>Relatório do Dia:</strong></label>
    <textarea id="txtReport" placeholder="Anotações gerais do relatório diário..."></textarea>
  </div>

  <div class="admin-controls">
    <span id="lockStatus">🔒 <strong>Modo: Bloqueado (Apenas Leitura)</strong></span>
    <input type="password" id="adminPassword" placeholder="Senha de Admin">
    <button class="btn btn-unlock" id="btnUnlock">Desbloquear para Edição</button>
    <button class="btn btn-lock" id="btnLock" style="display:none;">Bloquear novamente</button>
  </div>

  <div class="columns-container">
    <div class="house-column" id="col-pixbet" data-house="Pixbet">
      <div class="house-title">Pixbet</div>
      <div class="cards-list"></div>
    </div>

    <div class="house-column" id="col-betdasorte" data-house="BetdaSorte">
      <div class="house-title">BetdaSorte</div>
      <div class="cards-list"></div>
    </div>

    <div class="house-column" id="col-ganheibet" data-house="Ganheibet">
      <div class="house-title">Ganheibet</div>
      <div class="cards-list"></div>
    </div>
  </div>

  <h3>Observações & Pendências</h3>
  <div class="notes-grid">
    <div class="note-box"><label>Caixa 1:</label><textarea id="note1" class="note-input"></textarea></div>
    <div class="note-box"><label>Caixa 2:</label><textarea id="note2" class="note-input"></textarea></div>
    <div class="note-box"><label>Caixa 3:</label><textarea id="note3" class="note-input"></textarea></div>
    <div class="note-box"><label>Caixa 4:</label><textarea id="note4" class="note-input"></textarea></div>
    <div class="note-box"><label>Caixa 5:</label><textarea id="note5" class="note-input"></textarea></div>
    <div class="note-box"><label>Caixa 6:</label><textarea id="note6" class="note-input"></textarea></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-Siu-U7Z9-arpi1wWL5kV6pdV3COjYQk",
      authDomain: "escala-ra.firebaseapp.com",
      projectId: "escala-ra",
      storageBucket: "escala-ra.firebasestorage.app",
      messagingSenderId: "826269273192",
      appId: "1:826269273192:web:ab4995fcd8697ce5bdffdd",
      measurementId: "G-MH61MGJH7J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let colaboradores = ["Amanda Lima", "Maria Eugênia", "Wanessa", "Áurea", "Lucas Silva", "Beatriz Costa"];

    const today = new Date().toLocaleDateString('pt-BR');
    document.getElementById('lblReportDate').innerHTML = `<strong>Relatório do Dia (${today}):</strong>`;

    // Referências do Firebase
    const escalaRef = ref(db, 'escala_ra/atual');
    const reportRef = ref(db, 'escala_ra/relatorio');
    const notesRef = ref(db, 'escala_ra/notas');

    // Escutar mudanças na Escala (Sincronização em Tempo Real)
    onValue(escalaRef, (snapshot) => {
      const data = snapshot.val() || {};
      const casas = ['col-pixbet', 'col-betdasorte', 'col-ganheibet'];
      casas.forEach(id => document.querySelector(`#${id} .cards-list`).innerHTML = '');

      Object.keys(data).forEach(id => {
        const item = data[id];
        const card = document.createElement('div');
        card.className = 'agent-card';
        card.id = id;
        card.innerText = item.nome;

        const targetColumn = document.getElementById(item.casaId);
        if (targetColumn) {
          targetColumn.querySelector('.cards-list').appendChild(card);
        }
      });

      if (isEditable) enableDragAndDrop();
    });

    // Escutar mudanças no Relatório e Notas
    onValue(reportRef, (snapshot) => {
      if (document.activeElement !== document.getElementById('txtReport')) {
        document.getElementById('txtReport').value = snapshot.val() || '';
      }
    });

    onValue(notesRef, (snapshot) => {
      const notes = snapshot.val() || {};
      for (let i = 1; i <= 6; i++) {
        const el = document.getElementById(`note${i}`);
        if (document.activeElement !== el) {
          el.value = notes[`note${i}`] || '';
        }
      }
    });

    // Sorteio e envio para o Firebase
    document.getElementById('btnSorteio').addEventListener('click', () => {
      const embaralhados = [...colaboradores].sort(() => Math.random() - 0.5);
      const casas = ['col-pixbet', 'col-betdasorte', 'col-ganheibet'];
      const escalaPayload = {};

      embaralhados.forEach((nome, index) => {
        const cardId = `agent-${index}`;
        const casaId = casas[index % casas.length];
        escalaPayload[cardId] = { nome: nome, casaId: casaId };
      });

      set(escalaRef, escalaPayload);
    });

    // Atualizar Relatório no Firebase
    document.getElementById('txtReport').addEventListener('input', (e) => {
      set(reportRef, e.target.value);
    });

    // Atualizar Caixas de Notas no Firebase
    document.querySelectorAll('.note-input').forEach(el => {
      el.addEventListener('input', () => {
        const payload = {};
        for (let i = 1; i <= 6; i++) {
          payload[`note${i}`] = document.getElementById(`note${i}`).value;
        }
        set(notesRef, payload);
      });
    });

    // Controle de Edição/Admin
    let isEditable = false;
    const btnUnlock = document.getElementById('btnUnlock');
    const btnLock = document.getElementById('btnLock');
    const adminPassword = document.getElementById('adminPassword');
    const lockStatus = document.getElementById('lockStatus');

    btnUnlock.addEventListener('click', () => {
      if (adminPassword.value === '1234') {
        isEditable = true;
        lockStatus.innerHTML = '🔓 <strong>Modo: Edição Liberada (Mova os cards)</strong>';
        btnUnlock.style.display = 'none';
        btnLock.style.display = 'inline-block';
        adminPassword.value = '';
        enableDragAndDrop();
      } else {
        alert('Senha incorreta!');
      }
    });

    btnLock.addEventListener('click', () => {
      isEditable = false;
      lockStatus.innerHTML = '🔒 <strong>Modo: Bloqueado (Apenas Leitura)</strong>';
      btnUnlock.style.display = 'inline-block';
      btnLock.style.display = 'none';
      disableDragAndDrop();
    });

    function enableDragAndDrop() {
      document.querySelectorAll('.agent-card').forEach(card => {
        card.setAttribute('draggable', true);
        card.classList.add('draggable');
        card.ondragstart = (e) => {
          e.dataTransfer.setData('text/plain', e.target.id);
        };
      });
    }

    function disableDragAndDrop() {
      document.querySelectorAll('.agent-card').forEach(card => {
        card.setAttribute('draggable', false);
        card.classList.remove('draggable');
      });
    }

    document.querySelectorAll('.house-column').forEach(column => {
      column.addEventListener('dragover', (e) => {
        if (!isEditable) return;
        e.preventDefault();
        column.classList.add('drag-over');
      });

      column.addEventListener('dragleave', () => column.classList.remove('drag-over'));

      column.addEventListener('drop', (e) => {
        if (!isEditable) return;
        e.preventDefault();
        column.classList.remove('drag-over');

        const cardId = e.dataTransfer.getData('text/plain');
        const card = document.getElementById(cardId);
        if (card) {
          const newCasaId = column.id;
          const agentName = card.innerText;

          // Atualiza a posição no Firebase
          set(ref(db, `escala_ra/atual/${cardId}`), {
            nome: agentName,
            casaId: newCasaId
          });
        }
      });
    });
  </script>
</body>
</html>
